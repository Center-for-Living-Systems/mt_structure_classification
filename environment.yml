# macOS (Apple Silicon / MPS) and CPU-only Linux
# For NVIDIA GPU, use environment-cuda.yml instead.
name: mt_structure_classification
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.21
  - pandas>=1.3
  - scikit-image>=0.19
  - scikit-learn>=1.0
  - opencv>=4.5
  - tifffile>=2021
  - matplotlib>=3.4
  - cellpose>=2.0
  - pytest>=7.0
  - pip
  - pip:
    - torch>=2.0.0
    - torchvision>=0.15.0
    - --index-url https://download.pytorch.org/whl/cpu  # CPU-only PyTorch
    - -e .