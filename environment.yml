name: mt_structure_classification
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4
  - numpy
  - pandas
  - matplotlib
  - scikit-image
  - tifffile
  - scipy
  - pillow
  - scikit-learn
  - tqdm
  - pip:
      - opencv-python
      - csbdeep
      - stardist
      - cellpose==3.1.1.2
      - -e .