# macOS (Apple Silicon / MPS) and CPU-only Linux
# For NVIDIA GPU, use environment-cuda.yml instead.
name: mt_structure_classification
channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # conda handles platform-specific PyTorch builds
  - pytorch::pytorch>=2.0
  - pytorch::torchvision>=0.15

  # everything else comes from pyproject.toml via pip
  - pip:
      - -e .
