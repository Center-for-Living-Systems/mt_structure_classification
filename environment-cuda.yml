# Linux with NVIDIA CUDA GPU
# For macOS or CPU-only, use environment.yml instead.

name: mt_structure_classification_cuda
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch::pytorch>=2.0.0
  - pytorch::torchvision>=0.15.0
  - pytorch::pytorch-cuda=12.4
  - numpy>=1.21
  - pandas>=1.3
  - scikit-image>=0.19
  - scikit-learn>=1.0
  - opencv>=4.5
  - tifffile>=2021
  - matplotlib>=3.4
  - cellpose>=2.0
  - pytest>=7.0
  - pip
  - pip:
    - -e .